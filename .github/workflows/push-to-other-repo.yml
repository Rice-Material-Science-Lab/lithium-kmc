name: Compile WASM and Push to Website

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.74"

      - name: Compile C++ to WASM
        run: |
          mkdir -p public
em++ lkmc-wasm.cpp -o public/lkmc-wasm.js -O3 -std=c++17 -fexceptions -sINITIAL_MEMORY=268435456 -sALLOW_MEMORY_GROWTH=1 -sEXPORT_ES6=1 -sMODULARIZE=1 -sEXPORTED_FUNCTIONS="[...]" -sEXPORTED_RUNTIME_METHODS="['ccall','cwrap','HEAP8','HEAPU8','HEAP32','HEAPF64','wasmMemory']" -sALLOW_TABLE_GROWTH=1
      - name: Push Build Artifacts to Destination Repo
        if: github.ref == 'refs/heads/main'
        env:
          DEST_PAT: ${{ secrets.UPDATE_WASM_PAT }}
        run: |
          # Clone the repo into a temp folder
          git clone https://x-access-token:${DEST_PAT}@github.com/Rice-Material-Science-Lab/lithium-website.git dest-repo

          # Copy js and wasm files into the public folder
          mkdir -p dest-repo/public/
          cp public/lkmc-wasm.js dest-repo/public/
          cp public/lkmc-wasm.wasm dest-repo/public/

          # Commit and push changes
          cd dest-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/lkmc-wasm.js public/lkmc-wasm.wasm

          # Only commit if changes actually exist to avoid failing the workflow step
          git diff-index --quiet HEAD || git commit -m "Automated WASM build update"
          git push origin main